# cargo-deny configuration: dependency policy, licenses and sources.
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# `mise run deny` runs the checks configured here. RustSec advisories are
# deliberately NOT part of that task: `mise run advisories` (cargo-audit) owns
# them. cargo-deny *can* check advisories too — `cargo deny check advisories` —
# and the [advisories] section below exists so those settings have a home.

[advisories]
# Add advisory IDs or yanked versions here, with a reason, when a finding has
# been reviewed and accepted. Keeping them here rather than ignoring them on the
# command line makes the decision visible to the whole project.
# Example:
#   ignore = [{ id = "RUSTSEC-0000-0000", reason = "not reachable from our code" }]
ignore = []

[licenses]
# Permissive licenses plus MPL-2.0 (file-level copyleft). A dependency under
# anything else fails the check on purpose: add it here only after reading the
# licence.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8
# A curated allow-list always contains licences a given dependency tree does not
# use, and that is not a defect to fix. `warn` (the default) would report every
# unused entry on a fresh project, so it is silenced here deliberately. Set it
# back to `warn` or `deny` if you would rather prune the list as the tree grows.
unused-allowed-license = "allow"

[licenses.private]
# This repository is `publish = false`, so its own crate has no licence yet.
# Ignoring unpublished crates keeps `mise run deny` useful out of the box.
# When you make a crate publishable, give it a `license` in Cargo.toml and set
# this to false so your own licence is checked too.
ignore = true

[bans]
# Two versions of the same crate are usually a mistake, but resolving them is
# not always possible. `--deny warnings` in the mise task escalates this.
multiple-versions = "warn"
# `*` version requirements in a manifest are never acceptable.
wildcards = "deny"
# Add crates to `deny` when a dependency must never enter the tree again.
deny = []

[sources]
# Dependencies may only come from crates.io. A git or alternative-registry
# dependency fails until it is listed here, so supply-chain changes are always
# a reviewed, visible edit.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
